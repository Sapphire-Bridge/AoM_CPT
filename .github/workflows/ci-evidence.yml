name: CI Evidence Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      strict_lock: ${{ steps.filter.outputs.strict_lock }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect strict-lock surface changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            strict_lock:
              - 'requirements.txt'
              - 'requirements.pip.lock.txt'
              - 'scripts/refresh_requirements_pip_lock.sh'
              - '.github/workflows/ci-evidence.yml'

  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Evidence ID Consistency
        run: python scripts/check_evidence_contract.py

      - name: Pytest Evidence Suite
        run: |
          python -m pytest -q tests/test_evidence_contract_ids.py tests/test_evidence_contract_fields.py

  strict-lock-drift:
    needs: changes
    if: needs.changes.outputs.strict_lock == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Regenerate strict pip lock
        run: |
          bash scripts/refresh_requirements_pip_lock.sh --python python --output /tmp/requirements.pip.lock.txt

      - name: Check strict pip lock drift
        run: |
          diff -u requirements.pip.lock.txt /tmp/requirements.pip.lock.txt
