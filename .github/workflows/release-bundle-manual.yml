name: Manual Replication Bundle

on:
  workflow_dispatch:
    inputs:
      repro_mode:
        description: "Repro path"
        required: true
        default: full_recompute
        type: choice
        options:
          - full_recompute
          - frozen_artifacts
      results_dir:
        description: "Results directory"
        required: true
        default: results_submission_full
        type: string
      tables_dir:
        description: "Tables directory"
        required: true
        default: tables_submission_full
        type: string
      archive_name:
        description: "Archive filename"
        required: true
        default: aom_replication_bundle_manual.tar.gz
        type: string
      revision:
        description: "Optional HF model revision pin"
        required: false
        default: ""
        type: string
      tokenizer_revision:
        description: "Optional HF tokenizer revision pin"
        required: false
        default: ""
        type: string

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install Dependencies
        run: |
          test -f requirements.pip.lock.txt
          python -m pip install --upgrade "pip==24.2"
          python -m pip install -r requirements.pip.lock.txt

      - name: Build Bundle
        shell: bash
        run: |
          set -euo pipefail
          lock_sha="$(sha256sum requirements.pip.lock.txt | awk '{print $1}')"
          export AOM_DEPENDENCY_INSTALL_FILE="requirements.pip.lock.txt"
          export AOM_DEPENDENCY_INSTALL_PROFILE="strict_pip_lock"
          export AOM_DEPENDENCY_INSTALL_SHA256="$lock_sha"
          export AOM_RUNNER_OS="ubuntu-24.04"
          export AOM_BASE_IMAGE="github-actions:ubuntu-24.04"
          cmd=(
            bash scripts/build_replication_bundle.sh
            --mode submission_full_strong
            --repro-mode "${{ inputs.repro_mode }}"
            --results-dir "${{ inputs.results_dir }}"
            --tables-dir "${{ inputs.tables_dir }}"
            --archive "${{ inputs.archive_name }}"
          )
          if [[ -n "${{ inputs.revision }}" ]]; then
            cmd+=(--revision "${{ inputs.revision }}")
          fi
          if [[ -n "${{ inputs.tokenizer_revision }}" ]]; then
            cmd+=(--tokenizer-revision "${{ inputs.tokenizer_revision }}")
          fi
          echo "[run] ${cmd[*]}"
          "${cmd[@]}"

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: replication-bundle
          path: |
            ${{ inputs.archive_name }}
            ${{ inputs.archive_name }}.sha256
          if-no-files-found: error
